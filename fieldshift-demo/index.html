<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>FieldShift Prototype</title>
<style>
  :root{--bg1:#0b1020;--bg2:#121a2d;--panel:rgba(255,255,255,.065);--line:rgba(255,255,255,.09);--text:#f5f7fb;--muted:rgba(245,247,251,.60);--gap:7px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 10%,#22325b 0,transparent 34%),linear-gradient(180deg,var(--bg2),var(--bg1));color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;overflow:hidden;touch-action:none}
  body{min-height:100svh;display:flex;align-items:center;justify-content:center}
  .app{width:min(100vw,520px);height:100svh;max-height:900px;padding:max(18px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center;gap:14px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;padding:0 3px}.brand{font-size:13px;letter-spacing:.15em;font-weight:800;color:var(--muted)}.score{font-size:38px;line-height:.95;font-weight:850;letter-spacing:-.04em}.best{text-align:right;font-size:12px;color:var(--muted);font-weight:700}.best strong{display:block;color:var(--text);font-size:18px;margin-top:2px}
  .fieldCard{min-height:68px;border:1px solid var(--line);background:var(--panel);border-radius:22px;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;backdrop-filter:blur(18px)}
  .fieldLabel{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.12em}.fieldRow{display:flex;align-items:center;gap:10px;margin-top:5px;font-size:16px;font-weight:800}.orbMini{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 2px 4px rgba(255,255,255,.5),0 0 18px currentColor}.combo{font-size:13px;font-weight:800;color:var(--muted);text-align:right;min-width:100px}
  .boardWrap{position:relative;width:100%;aspect-ratio:1/1}.board{position:absolute;inset:0;border-radius:27px;padding:10px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);box-shadow:0 22px 70px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.06);overflow:hidden}
  .grid{position:absolute;inset:10px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:var(--gap)}
  .cell{border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.035);display:flex;align-items:center;justify-content:center}
  .piece{width:78%;aspect-ratio:1/1;border-radius:50%;box-shadow:inset 0 4px 8px rgba(255,255,255,.45),inset 0 -5px 10px rgba(0,0,0,.23),0 7px 16px rgba(0,0,0,.25);filter:saturate(.72) brightness(.82);transition:transform 140ms cubic-bezier(.2,.9,.25,1),opacity 120ms ease,filter 140ms ease}
  .piece.active{filter:saturate(1.2) brightness(1.08);box-shadow:inset 0 4px 8px rgba(255,255,255,.50),inset 0 -5px 10px rgba(0,0,0,.20),0 0 0 2px rgba(255,255,255,.18),0 0 22px currentColor}
  .piece.spawn{animation:spawn .25s cubic-bezier(.2,1.4,.3,1)}.piece.clear{opacity:0;transform:scale(.2);filter:brightness(1.8)}@keyframes spawn{from{transform:scale(.15);opacity:0}}
  .hint{font-size:13px;text-align:center;color:var(--muted);font-weight:650;min-height:18px}.buttons{display:flex;gap:10px}button{flex:1;border:0;border-radius:17px;padding:13px 14px;background:rgba(255,255,255,.09);color:white;font:inherit;font-weight:800;font-size:14px}button:active{transform:scale(.98)}
  .overlay{position:absolute;inset:0;border-radius:27px;background:rgba(6,9,17,.76);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;flex-direction:column;padding:30px;text-align:center;z-index:5}.overlay.show{display:flex}.overTitle{font-size:36px;font-weight:900;letter-spacing:-.04em}.overText{margin:7px 0 20px;color:var(--muted);font-size:14px;line-height:1.4}.overlay button{width:100%;margin-top:8px;flex:0}.primary{background:white;color:#101522}
  .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);padding:9px 14px;border-radius:999px;background:rgba(255,255,255,.92);color:#111827;font-weight:900;font-size:13px;opacity:0;pointer-events:none;z-index:4}.toast.show{animation:toast .7s ease}@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%) scale(.8)}25%{opacity:1;transform:translate(-50%,-55%) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(.96)}}
  .shake{animation:shake .18s linear}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.rules{font-size:11px;color:rgba(255,255,255,.42);text-align:center;line-height:1.35}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">FIELDSHIFT • PROTOTYPE</div><div class="score" id="score">0</div></div><div class="best">BEST<strong id="best">0</strong></div></div>
  <div class="fieldCard"><div><div class="fieldLabel">MAGNETIC FIELD</div><div class="fieldRow"><span class="orbMini" id="fieldOrb"></span><span id="fieldName">BLUE</span> MOVES</div></div><div class="combo" id="combo">Swipe anywhere</div></div>
  <div class="boardWrap" id="gestureArea"><div class="board" id="board"><div class="grid" id="grid"></div><div class="toast" id="toast"></div><div class="overlay" id="gameOver"><div class="overTitle">JAMMED</div><div class="overText" id="overText">Score 0</div><button class="primary" id="restartBig">Play again</button><button id="reviveBtn">Revive 3 moves • demo ad slot</button></div></div></div>
  <div class="hint">Swipe. Only the glowing color moves. Connect 3+.</div><div class="buttons"><button id="restart">Restart</button></div><div class="rules">Clear 3+ touching balls. A clear skips the next spawn. Consecutive clears build a score combo.</div>
</div>
<script>
(function(){
  'use strict';
  var N=6;
  var COLORS=[{name:'BLUE',hex:'#56a8ff'},{name:'PINK',hex:'#ff5f9e'},{name:'GOLD',hex:'#ffc84b'}];
  var gridEl=document.getElementById('grid'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),fieldOrb=document.getElementById('fieldOrb'),fieldName=document.getElementById('fieldName'),comboEl=document.getElementById('combo'),boardEl=document.getElementById('board'),toastEl=document.getElementById('toast'),overlay=document.getElementById('gameOver'),overText=document.getElementById('overText'),reviveBtn=document.getElementById('reviveBtn');
  var cells=[]; for(var i=0;i<N*N;i++){var c=document.createElement('div');c.className='cell';gridEl.appendChild(c);cells.push(c);}
  var grid,balls,nextId,activeColor,colorCursor,score,combo,turns,locked,ended,revived,history;
  var best=0; try{best=Number(localStorage.getItem('fieldshift-best')||0);}catch(e){} bestEl.textContent=best;
  function clone(obj){return JSON.parse(JSON.stringify(obj));}
  function snapshot(){return {grid:clone(grid),balls:clone(balls),nextId:nextId,activeColor:activeColor,colorCursor:colorCursor,score:score,combo:combo,turns:turns,revived:revived};}
  function restore(s){grid=clone(s.grid);balls=clone(s.balls);nextId=s.nextId;activeColor=s.activeColor;colorCursor=s.colorCursor;score=s.score;combo=s.combo;turns=s.turns;revived=s.revived;ended=false;locked=false;overlay.classList.remove('show');render();updateUI();}
  function eachBall(fn){for(var id in balls){if(Object.prototype.hasOwnProperty.call(balls,id))fn(Number(id),balls[id]);}}
  function render(spawnedId){for(var i=0;i<cells.length;i++)cells[i].innerHTML='';eachBall(function(id,b){var cell=cells[b.y*N+b.x];var el=document.createElement('div');el.className='piece';el.setAttribute('data-id',String(id));el.style.background=COLORS[b.color].hex;el.style.color=COLORS[b.color].hex;if(b.color===activeColor)el.className+=' active';if(id===spawnedId)el.className+=' spawn';cell.appendChild(el);});}
  function updateUI(){scoreEl.textContent=score;bestEl.textContent=best;fieldOrb.style.background=COLORS[activeColor].hex;fieldOrb.style.color=COLORS[activeColor].hex;fieldName.textContent=COLORS[activeColor].name;comboEl.textContent=combo>1?'COMBO ×'+combo:'Swipe anywhere';var els=gridEl.querySelectorAll('.piece');for(var i=0;i<els.length;i++){var b=balls[els[i].getAttribute('data-id')];if(b){if(b.color===activeColor)els[i].classList.add('active');else els[i].classList.remove('active');}}}
  function emptyCells(){var a=[];for(var y=0;y<N;y++)for(var x=0;x<N;x++)if(grid[y][x]===null)a.push([x,y]);return a;}
  function addBall(x,y,color){var id=nextId++;grid[y][x]=id;balls[id]={x:x,y:y,color:color};return id;}
  function findGroups(color){var seen={},clear=[];eachBall(function(id,b){if(b.color!==color||seen[id])return;var group=[],q=[id];seen[id]=true;while(q.length){var cid=q.pop(),cb=balls[cid];group.push(cid);var dirs=[[1,0],[-1,0],[0,1],[0,-1]];for(var d=0;d<dirs.length;d++){var nx=cb.x+dirs[d][0],ny=cb.y+dirs[d][1];if(nx<0||nx>=N||ny<0||ny>=N)continue;var nid=grid[ny][nx],nb=nid!==null?balls[nid]:null;if(nb&&nb.color===color&&!seen[nid]){seen[nid]=true;q.push(nid);}}}if(group.length>=3)clear=clear.concat(group);});return clear;}
  function wouldCreateMatch(x,y,color){var fake=999999;grid[y][x]=fake;balls[fake]={x:x,y:y,color:color};var m=findGroups(color).length>0;delete balls[fake];grid[y][x]=null;return m;}
  function spawnOne(){var e=emptyCells();if(!e.length)return null;var options=[];for(var i=0;i<e.length;i++)for(var color=0;color<COLORS.length;color++)if(!wouldCreateMatch(e[i][0],e[i][1],color))options.push([e[i][0],e[i][1],color]);var pick;if(options.length)pick=options[Math.floor(Math.random()*options.length)];else{var ec=e[Math.floor(Math.random()*e.length)];pick=[ec[0],ec[1],Math.floor(Math.random()*COLORS.length)];}return addBall(pick[0],pick[1],pick[2]);}
  function hasGroup3(){for(var c=0;c<COLORS.length;c++)if(findGroups(c).length)return true;return false;}
  function seed(){for(var attempt=0;attempt<100;attempt++){grid=[];for(var y=0;y<N;y++){grid[y]=[];for(var x=0;x<N;x++)grid[y][x]=null;}balls={};nextId=1;for(var color=0;color<COLORS.length;color++)for(var k=0;k<4;k++){var e=emptyCells(),p=e[Math.floor(Math.random()*e.length)];addBall(p[0],p[1],color);}if(!hasGroup3())return;}}
  function legalMoveForColor(color){var dirs=[[1,0],[-1,0],[0,1],[0,-1]],yes=false;eachBall(function(id,b){if(yes||b.color!==color)return;for(var i=0;i<dirs.length;i++){var nx=b.x+dirs[i][0],ny=b.y+dirs[i][1];if(nx>=0&&nx<N&&ny>=0&&ny<N&&grid[ny][nx]===null){yes=true;return;}}});return yes;}
  function hasColor(color){var yes=false;eachBall(function(id,b){if(b.color===color)yes=true;});return yes;}
  function advanceActive(){for(var i=0;i<COLORS.length;i++){colorCursor=(colorCursor+1)%COLORS.length;if(hasColor(colorCursor)&&legalMoveForColor(colorCursor)){activeColor=colorCursor;return true;}}return false;}
  function performMove(dx,dy){var list=[];eachBall(function(id,b){if(b.color===activeColor)list.push({id:id,b:b,ox:b.x,oy:b.y});});list.sort(function(a,b){if(dx<0)return a.ox-b.ox;if(dx>0)return b.ox-a.ox;if(dy<0)return a.oy-b.oy;return b.oy-a.oy;});var moved=false;for(var i=0;i<list.length;i++){var item=list[i],bb=item.b;grid[bb.y][bb.x]=null;var x=bb.x,y=bb.y;while(true){var nx=x+dx,ny=y+dy;if(nx<0||nx>=N||ny<0||ny>=N||grid[ny][nx]!==null)break;x=nx;y=ny;}bb.x=x;bb.y=y;grid[y][x]=item.id;if(x!==item.ox||y!==item.oy)moved=true;}return moved;}
  function showToast(t){toastEl.textContent=t;toastEl.classList.remove('show');void toastEl.offsetWidth;toastEl.classList.add('show');}
  function vibrate(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
  function bump(){boardEl.classList.remove('shake');void boardEl.offsetWidth;boardEl.classList.add('shake');vibrate(18);}
  function pressureSpawnCount(){if(turns<18)return 1;if(turns<40)return turns%4===0?2:1;return turns%3===0?2:1;}
  function endGame(){ended=true;locked=false;if(score>best){best=score;try{localStorage.setItem('fieldshift-best',best);}catch(e){}}updateUI();overText.textContent='Score '+score+' • '+turns+' swipes';reviveBtn.style.display=(!revived&&history.length>=3)?'block':'none';overlay.classList.add('show');vibrate([45,50,70]);}
  function resolveSwipe(dx,dy){if(locked||ended)return;locked=true;var before=snapshot();var moved=performMove(dx,dy);if(!moved){bump();locked=false;return;}history.push(before);if(history.length>8)history.shift();turns++;render();vibrate(9);setTimeout(function(){var clearIds=findGroups(activeColor);if(clearIds.length){combo++;var gain=clearIds.length*10*combo;score+=gain;showToast('+'+gain+(combo>1?'  COMBO ×'+combo:''));for(var i=0;i<clearIds.length;i++){var el=gridEl.querySelector('[data-id="'+clearIds[i]+'"]');if(el)el.classList.add('clear');}setTimeout(function(){for(var j=0;j<clearIds.length;j++){var b=balls[clearIds[j]];if(!b)continue;grid[b.y][b.x]=null;delete balls[clearIds[j]];}vibrate([20,25,35]);render();finishTurn();},130);}else{combo=0;spawnSequence(pressureSpawnCount(),0);}function spawnSequence(total,index){if(index>=total){finishTurn();return;}var id=spawnOne();if(id===null){endGame();return;}render(id);setTimeout(function(){spawnSequence(total,index+1);},80);}function finishTurn(){if(score>best){best=score;try{localStorage.setItem('fieldshift-best',best);}catch(e){}}if(!advanceActive()){endGame();return;}updateUI();locked=false;}},160);}
  function newGame(){seed();score=0;combo=0;turns=0;locked=false;ended=false;revived=false;history=[];colorCursor=-1;activeColor=0;for(var c=0;c<COLORS.length;c++)if(legalMoveForColor(c)){activeColor=c;colorCursor=c;break;}overlay.classList.remove('show');render();updateUI();}
  function revive(){if(revived||history.length<3)return;var s=history[Math.max(0,history.length-3)];restore(s);revived=true;history=[];showToast('FIELD REWOUND');}
  var sx=0,sy=0,drag=false,area=document.getElementById('gestureArea');
  function start(x,y){sx=x;sy=y;drag=true;}function finish(x,y){if(!drag)return;drag=false;var dx=x-sx,dy=y-sy;if(Math.sqrt(dx*dx+dy*dy)<28){bump();return;}if(Math.abs(dx)>Math.abs(dy))resolveSwipe(dx>0?1:-1,0);else resolveSwipe(0,dy>0?1:-1);}
  area.addEventListener('touchstart',function(e){var t=e.changedTouches[0];start(t.clientX,t.clientY);e.preventDefault();},{passive:false});area.addEventListener('touchend',function(e){var t=e.changedTouches[0];finish(t.clientX,t.clientY);e.preventDefault();},{passive:false});
  area.addEventListener('mousedown',function(e){start(e.clientX,e.clientY);});window.addEventListener('mouseup',function(e){finish(e.clientX,e.clientY);});
  document.getElementById('restart').onclick=newGame;document.getElementById('restartBig').onclick=newGame;reviveBtn.onclick=revive;
  newGame();
})();
</script>
</body>
</html>
